<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>USDT Global Pool - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .auth-card { max-width: 400px; margin: 40px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .wallet-box { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- LOGIN SECTION -->
    <div id="login-section" class="container">
        <div class="auth-card">
            <h3 class="text-center text-primary">🌐 USDT Global Pool</h3>
            <input type="text" id="phone" class="form-control mb-3" placeholder="मोबाइल नंबर">
            <input type="password" id="pass" class="form-control mb-3" placeholder="पासवर्ड">
            <button class="btn btn-primary w-100" onclick="login()">Login</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-section" class="container mt-4" style="display:none;">
        <div class="wallet-box">
            <h5>Working Wallet: 0.00 USDT</h5>
        </div>
        
        <div class="d-grid gap-2">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeVC6O8BGGcnaqIxVcGG8VPmMfsuKuS0CIY4qZwJlRV31tSLw/viewform" target="_blank" class="btn btn-primary btn-lg">📥 Submit Deposit / Withdraw Request</a>
            
            <div class="card mt-3">
                <div class="card-body">
                    <h5>🔍 ट्रांजैक्शन स्टेटस</h5>
                    <button class="btn btn-info w-100" onclick="window.open('https://docs.google.com/spreadsheets/d/1yfmHySp2dz3s9yrC21Qb_GhVO_6UYRQuUO4c4dgKG9Y/edit', '_blank')">Check My Status</button>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-body">
                    <h5>👥 मेरी टीम रिपोर्ट</h5>
                    <button class="btn btn-warning w-100 fw-bold" onclick="window.open('https://docs.google.com/spreadsheets/d/1yfmHySp2dz3s9yrC21Qb_GhVO_6UYRQuUO4c4dgKG9Y/edit', '_blank')">🚀 View My Team Stats</button>
                </div>
            </div>
            
            <button class="btn btn-danger mt-3" onclick="location.reload()">🚪 Logout</button>
        </div>
    </div>

    <script>
        function login() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
        }
    </script>
</body>
</html>
