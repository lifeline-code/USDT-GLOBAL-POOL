<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>USDT Global Pool - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .auth-card { max-width: 400px; margin: 40px auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .wallet-box { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- DASHBOARD -->
    <div id="dashboard-section" class="container mt-4">
        <div class="wallet-box text-center">
            <h5>Working Wallet: 0.00 USDT</h5>
        </div>
        
        <div class="d-grid gap-2">
            <!-- Deposit Section with BEP-20 Address -->
            <div class="card bg-light">
                <div class="card-body">
                    <h5 class="text-primary">📥 Deposit USDT (BEP-20)</h5>
                    <p class="small">फंड इस एड्रेस पर भेजें:</p>
                    <div class="alert alert-dark font-monospace text-break" style="font-size: 12px;">
                        0x61Dacc9840D88ef901035a9bec90411960eB464E
                    </div>
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLSeVC6O8BGGcnaqIxVcGG8VPmMfsuKuS0CIY4qZwJlRV31tSLw/viewform" 
                       target="_blank" class="btn btn-primary w-100">Submit TXID After Deposit</a>
                </div>
            </div>
            
            <!-- Status Check -->
            <div class="card mt-2">
                <div class="card-body">
                    <h5>🔍 अपना स्टेटस चेक करें</h5>
                    <button class="btn btn-info w-100" onclick="window.open('https://docs.google.com/spreadsheets/d/1yfmHySp2dz3s9yrC21Qb_GhVO_6UYRQuUO4c4dgKG9Y/edit', '_blank')">Check My Status</button>
                </div>
            </div>

            <button class="btn btn-danger mt-3" onclick="location.reload()">🚪 Logout</button>
        </div>
    </div>

</body>
</html>
